name: Claude Check Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "plugins/*/agents/**"

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  check-agent:
    # Fork PRs get no secrets: only run for same-repo PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the agents added or changed in PR #${{ github.event.pull_request.number }}
            (base ${{ github.event.pull_request.base.sha }}, head ${{ github.event.pull_request.head.sha }}).
            List them with `git diff --name-status ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- 'plugins/*/agents/'`
            and read each one in full.

            VERIFY, per agent file `plugins/<plugin>/agents/<agent>.md`:
            - Frontmatter has `name`, `description` and `tools`
            - `name` follows `<plugin>-<purpose>` and matches the plugin directory it lives in
            - The plugin is listed in .claude-plugin/marketplace.json and the plugin's plugin.json `version` was bumped
            - README.md plugin table lists the agent
            - No secrets, tokens, PII or customer data (this repo is public)

            SUGGEST improvements, only where they apply:
            - Description: says what the agent does AND when to delegate to it (concrete trigger phrases), not just a label
            - Tools: least privilege; flag broad tools (Bash, Write, Edit) the described job does not need, and read-only agents that list write tools
            - System prompt: clear role, scope and boundaries, numbered steps, expected output format, and what to do when blocked or when input is ambiguous
            - Safety: no production mutations, no reading credential files, consistent with CLAUDE.md rules
            - Overlap: duplicates or conflicts with existing agents or skills in the repo
            - Replace demo content with real behavior if the agent is still a placeholder

            REPORT: post ONE comment on the PR with `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`
            (write the body to a temp file first). Write the comment in Markdown with this structure:
            - `## Summary`: 2-4 lines with the overall verdict (pass / needs changes), the agents reviewed,
              and counts of checks passed, checks failed and suggestions.
            - `## Report`: one `###` subsection per agent with a "Verification" pass/fail checklist
              (use ✅ / ❌) and "Suggestions" (prioritized, each with a short concrete rewrite).
            Keep it concise.
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 12
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*),Read,Grep,Glob,Write"
