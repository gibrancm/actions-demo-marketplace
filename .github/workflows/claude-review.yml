name: Claude Review

# claude-code-action does not support `push` events, so review on pull requests instead.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  review:
    # Fork PRs get no secrets: only run for same-repo PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}).
            Use `git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}` to see the changes.
            This repo is a Claude Code plugin marketplace. Check for:
            - Valid JSON in marketplace.json and plugin.json files, and that every plugin in marketplace.json has a matching plugins/<name> directory
            - Skills (SKILL.md) and agents (*.md) with correct frontmatter (name, description)
            - Secrets, tokens, PII or customer data (this repo is public)
            - README.md and CLAUDE.md out of sync with the plugins
            Post ONE comment on the PR with `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`
            (write the body to a temp file first). Write the comment in Markdown with this structure:
            - `## Summary`: 2-4 lines with the overall verdict (looks good / needs changes), the files reviewed,
              and the number of issues found.
            - `## Report`: a checklist (✅ / ❌) for each check above, listing concrete issues with file and line,
              or stating the changes look good.
          claude_args: >-
            --max-turns 10
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*),Read,Grep,Glob,Write"
